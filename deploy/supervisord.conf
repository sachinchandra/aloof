[unix_http_server]
file=/run/paas-supervisor.sock
[supervisord]
logfile=/workspace/paas/data/supervisord.log
logfile_maxbytes=50MB
logfile_backups=5
pidfile=/run/paas-supervisord.pid
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///run/paas-supervisor.sock
[program:dockerd]
command=dockerd
priority=10
autorestart=true
stdout_logfile=/workspace/paas/data/dockerd.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
redirect_stderr=true
[program:paas]
command=/workspace/paas/.venv/bin/python -m paas.main
directory=/workspace/paas
user=box
environment=PAAS_BRAND="Aloof",PAAS_BASE_DOMAIN="localhost",PAAS_PROXY_URL="http://localhost:8080",PAAS_REGISTRY="127.0.0.1:5000",PAAS_REGISTRY_NODE="10.88.0.1:5000",PAAS_WG_ENDPOINT="192.168.77.1:51820",PAAS_NODE_API_URL="http://192.168.77.1:8000",HOME="/home/box"
priority=20
autorestart=true
startretries=100
stdout_logfile=/workspace/paas/data/paas.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
redirect_stderr=true
[program:mcp]
command=/workspace/paas/.venv/bin/python mcp_server/server.py --http
directory=/workspace/paas
user=box
environment=PAAS_API_URL="http://localhost:8000",MCP_PUBLIC_URL="http://localhost:8001",HOME="/home/box"
priority=30
autorestart=true
startretries=100
stdout_logfile=/workspace/paas/data/mcp.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
redirect_stderr=true
[program:caddy]
command=/usr/local/bin/caddy run --config /workspace/paas/deploy/Caddyfile --adapter caddyfile
environment=PAAS_BASE_DOMAIN="localhost",XDG_DATA_HOME="/workspace/paas/data/caddy",XDG_CONFIG_HOME="/workspace/paas/data/caddy"
priority=40
autorestart=true
stdout_logfile=/workspace/paas/data/caddy.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
redirect_stderr=true
