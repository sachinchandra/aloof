id = "vaultwarden"
name = "Vaultwarden"
description = "Lightweight Bitwarden-compatible password manager server."
category = "Security"
website = "https://github.com/dani-garcia/vaultwarden"
[source]
image = "vaultwarden/server:latest"
[app]
port = 80
plan = "shared-1x-256mb"
region = "nbg1"
[[env]]
name = "ADMIN_TOKEN"
generate = "secret:48"
description = "Token for the /admin panel. Generated, shown once after deploy, stored as a secret. HTTPS is enforced by the Aloof edge (http redirects to https); Vaultwarden itself sends no HSTS header."
[[env]]
name = "DOMAIN"
value = "${APP_URL}"
[[env]]
name = "SIGNUPS_ALLOWED"
value = "false"
required = false
description = "Off by default so strangers can't register. Create your account by inviting your email from /admin (log in with ADMIN_TOKEN), then register with that email; or set true briefly and back to false."
[[env]]
name = "INVITATIONS_ALLOWED"
value = "true"
required = false
description = "Lets the admin panel invite users (works without SMTP: invited emails can register directly)."
[[volumes]]
name = "data"
path = "/data"
size_gb = 1
