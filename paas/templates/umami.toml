id = "umami"
name = "Umami"
description = "Privacy-friendly web analytics (Google Analytics alternative) on managed Postgres. The default admin/umami login is replaced during the deploy (the deploy fails if it cannot be) with a generated password, shown once as ADMIN_LOGIN."
category = "Analytics"
website = "https://umami.is"
init = "umami-admin"
[source]
image = "ghcr.io/umami-software/umami:latest"
[app]
port = 3000
plan = "shared-1x-512mb"
region = "nbg1"
[[env]]
name = "APP_SECRET"
generate = "secret:32"
[postgres]
plan = "pg-dev"
var = "DATABASE_URL"
